<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex, nofollow">
  <title>面談確定フォーム</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="page-header">
      <p class="eyebrow">INTERVIEW DESK</p>
      <h1>面談確定フォーム</h1>
      <p class="intro">面談が確定した対象者を担当者別シートに新規登録し、LINE共有文を作成します。</p>
    </header>

    <div id="notice" class="notice hidden" role="status"></div>

    <section class="card" id="token-card">
      <h2>合言葉</h2>
      <div class="grid">
        <label class="wide">合言葉 <input id="token" type="password" autocomplete="off" placeholder="管理者から共有された合言葉"><small>この端末に保存されます。</small></label>
      </div>
    </section>

    <form id="interview-form" novalidate>
      <section class="card">
        <h2>面談種別・担当者・対象者</h2>
        <div class="grid">
          <label class="wide">面談種別 <select name="interviewType" required><option value="">選択してください</option><option>ライバー</option><option>ライバー＆マネージャー</option><option>マネージャー</option></select><small>共有文のタイトルになります（シートには記録しません）。</small></label>
          <label>担当者（登録先シート） <select name="sheetName" required><option value="">選択してください</option></select></label>
          <label>担当者名 <input name="managerName" autocomplete="off" required placeholder="例：山田"><small>シートの「担当者名」列に入ります。</small></label>
          <label class="wide">XプロフィールURL <input name="xUrl" type="url" inputmode="url" autocapitalize="off" placeholder="https://x.com/..." required></label>
          <label>対象者ユーザー名 <input name="targetName" autocomplete="off" required placeholder="表示名"></label>
          <label>対象者ID <input name="targetId" autocomplete="off" autocapitalize="off" placeholder="URLから自動入力"><small>URLから判定できない場合のみ入力</small></label>
        </div>
      </section>

      <section class="card">
        <h2>面談・連絡日</h2>
        <div class="grid">
          <label>面談日 <input name="meetingDate" type="date" required></label>
          <label>面談時刻 <input name="meetingTime" type="time" required></label>
          <label>初回送信日 <input name="firstContactDate" type="date" required></label>
          <label>相手からの返信日 <input name="replyDate" type="date" required></label>
          <label>最終送信日 <input name="lastSentDate" type="date" required></label>
        </div>
      </section>

      <section class="card">
        <h2>連絡方法</h2>
        <div class="grid">
          <label class="wide">使用ツール <select name="tool" required><option value="">選択してください</option><option>LINE</option><option>Discord</option></select></label>
          <label class="discord-field hidden">Discordユーザー名 <input name="discordUsername" autocomplete="off" autocapitalize="off"><small>共有文のみに使用</small></label>
          <label class="discord-field hidden">Discord招待URL <input name="discordInviteUrl" type="url" inputmode="url" autocapitalize="off" placeholder="https://discord.gg/..."><small>共有文のみに使用</small></label>
          <label class="wide">備考 <textarea name="notes" rows="3" maxlength="450" placeholder="任意"></textarea><small>シートの備考欄に入ります（共有文には含みません）。</small></label>
        </div>
      </section>

      <div class="actions">
        <button id="submit-button" class="primary" type="submit" disabled>シートに登録</button>
      </div>
      <p id="result" class="result" aria-live="polite"></p>
    </form>

    <section class="card hidden" id="share-card">
      <h2>LINE共有文</h2>
      <textarea id="share-text" rows="18" readonly></textarea>
      <div class="actions share-actions">
        <button id="copy-button" type="button">コピー</button>
        <button id="share-button" type="button">共有</button>
        <a id="line-button" class="button line" href="#" target="_blank" rel="noopener">LINEで送る</a>
      </div>
      <button id="reset-button" type="button" class="ghost">続けて別の面談を登録</button>
    </section>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
